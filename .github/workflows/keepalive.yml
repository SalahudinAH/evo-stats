# Backup for the daily weight Shortcut: pings the database every 3 days so the
# free Supabase project never pauses for inactivity.
name: Keep database awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.SUPABASE_URL != ''
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
